name: SQLShield verification

on:
  push:
  pull_request:

jobs:
  verify-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-verification.txt
      - name: Run regression tests
        run: pytest -q
      - name: Strict prediction-level verification
        run: python scripts/verify_reported_results.py
      - name: Regenerate error audit
        run: python scripts/analyze_fixed_test_errors.py
      - name: Verify repository checksums
        run: sha256sum -c SHA256SUMS.txt
