[build-system]
requires = ["setuptools==69.5.1", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlshield-research"
version = "1.4.0"
description = "Leakage-resistant SQL injection detection with statistical uncertainty, prediction-level verification, near-duplicate sensitivity, and cross-source diagnostics"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scipy==1.12.0",
  "scikit-learn==1.4.2",
  "xgboost==2.0.3",
  "torch==2.2.2",
  "transformers==4.40.2",
  "datasketch==1.6.5",
]

[tool.setuptools.packages.find]
include = ["sqlshield*"]
